name: chai_frontend
description: A Flutter frontend for ChaiBackend video platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP client for API calls
  http: ^1.1.0
  
  # State management
  provider: ^6.1.1
  
  # Local storage for tokens
  shared_preferences: ^2.2.2
  
  # Image picker for avatar/cover upload
  image_picker: ^1.0.4
  
  # Cached network images
  cached_network_image: ^3.3.0
  
  # Icons
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
